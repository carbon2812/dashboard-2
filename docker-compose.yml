services:
  # -------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: expense_tracker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-expense_tracker}
    ports:
      # Map custom host port (5438 by default) -> container 5432 to avoid VPS conflicts
      - "${POSTGRES_PORT:-5438}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expense_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - expense_network

  # -------------------------------------------------------------
  # 2. Node.js Express + Prisma ORM Backend API
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expense_tracker_backend
    restart: unless-stopped
    ports:
      # Map custom host port (5055 by default) -> container 5001 to avoid VPS conflicts
      - "${BACKEND_PORT:-5055}:5001"
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-expense_tracker}?schema=public"
      JWT_SECRET: ${JWT_SECRET:-expense_tracker_prod_super_secret_jwt_key_2026}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3005,http://localhost:3000,http://localhost:8088}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - expense_network

  # -------------------------------------------------------------
  # 3. Next.js 14 Frontend Client
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_API_URL: "http://backend:5001"
    container_name: expense_tracker_frontend
    restart: unless-stopped
    ports:
      # Map custom host port (3005 by default) -> container 3000 to avoid VPS conflicts
      - "${FRONTEND_PORT:-3005}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3005}
      BACKEND_API_URL: "http://backend:5001"
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - expense_network

  # -------------------------------------------------------------
  # 4. Nginx Reverse Proxy Gateway
  # -------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: expense_tracker_nginx
    restart: unless-stopped
    ports:
      # Map custom gateway port (8088 by default, or set NGINX_PORT=0 for random host port)
      - "${NGINX_PORT:-8088}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - expense_network

# -------------------------------------------------------------
# Persistent Volumes
# -------------------------------------------------------------
volumes:
  postgres_data:
    name: expense_tracker_postgres_data

# -------------------------------------------------------------
# Isolated Docker Bridge Network
# -------------------------------------------------------------
networks:
  expense_network:
    name: expense_tracker_network
    driver: bridge
