version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: expense_tracker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: expense_tracker
    ports:
      # Map host 5434 -> container 5432 to avoid host port conflicts
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expense_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - expense_network

  # -------------------------------------------------------------
  # 2. Node.js Express + Prisma ORM Backend API
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expense_tracker_backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/expense_tracker?schema=public"
      CLOUDINARY_CLOUD_NAME: "rgukte0l"
      CLOUDINARY_API_KEY: "773645529246291"
      CLOUDINARY_API_SECRET: "JOUweAwRE6ZUTXD9-NKVd1HZx8I"
      CLOUDINARY_URL: "cloudinary://773645529246291:JOUweAwRE6ZUTXD9-NKVd1HZx8I@rgukte0l"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/public/uploads
    networks:
      - expense_network

  # -------------------------------------------------------------
  # 3. Next.js 14 Frontend Client
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: expense_tracker_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      BACKEND_API_URL: "http://backend:5001"
    depends_on:
      - backend
    networks:
      - expense_network

# -------------------------------------------------------------
# Persistent Volumes
# -------------------------------------------------------------
volumes:
  postgres_data:
    name: expense_tracker_postgres_data
  backend_uploads:
    name: expense_tracker_backend_uploads

# -------------------------------------------------------------
# Network
# -------------------------------------------------------------
networks:
  expense_network:
    name: expense_tracker_network
    driver: bridge
